<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Tutor</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Chess libraries -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Left Side: Chat -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>Chess Coach</h2>
            </div>
            <div id="chatMessages" class="chat-messages">
                <div class="message assistant">
                    <strong>Coach:</strong> Hello! Set up a position on the board and ask me anything about chess. I can analyze positions, explain moves, or answer questions.
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Ask about the position or chess in general...">
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <!-- Right Side: Chess Board -->
        <div class="board-section">
            <div class="board-controls">
                <button id="resetBtn">Reset Board</button>
                <button id="flipBtn">Flip Board</button>
            </div>
            <div id="board"></div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
